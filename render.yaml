databases:
  - name: arogyavajra-db
    databaseName: arogyavajra
    user: arogyavajra
    plan: starter
    postgresMajorVersion: "16"

services:
  # Backend API Web Service
  - type: web
    name: arogyavajra-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: arogyavajra
      - key: DATABASE_URL
        fromDatabase:
          name: arogyavajra-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: arogyavajra-web
          property: url
      - key: TRUSTED_PROXIES
        value: ""

  # Frontend Web Service
  - type: web
    name: arogyavajra-web
    runtime: docker
    rootDir: apps/web
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
    dockerBuildArgs:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: arogyavajra-api
          property: url
