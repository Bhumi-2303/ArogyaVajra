
name: Arogyavajra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: arogyavajra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Lint, Security, Migrations & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arogyavajra
          POSTGRES_PASSWORD: arogyavajra_dev_password
          POSTGRES_DB: arogyavajra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arogyavajra -d arogyavajra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://arogyavajra:arogyavajra_dev_password@localhost:5432/arogyavajra
      JWT_SECRET_KEY: ci-only-insecure-secret-not-for-production
      APP_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/pyproject.toml

      - name: Install Backend Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Run Ruff Lint Gate
        working-directory: apps/api
        run: python scripts/lint_gate.py

      - name: Verify Python Formatting
        working-directory: apps/api
        run: ruff format --check .

      - name: Audit Python Dependencies
        working-directory: apps/api
        run: pip-audit

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import time
          import psycopg

          for attempt in range(30):
              try:
                  with psycopg.connect(
                      "postgresql://arogyavajra:arogyavajra_dev_password"
                      "@localhost:5432/arogyavajra"
                  ):
                      print("PostgreSQL is ready.")
                      break
              except psycopg.OperationalError:
                  print(f"Waiting for PostgreSQL ({attempt + 1}/30)...")
                  time.sleep(1)
          else:
              raise SystemExit("PostgreSQL did not become ready.")
          PY

      - name: Run Database Migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Verify Database Migration Consistency
        working-directory: apps/api
        run: alembic check

      - name: Run Backend Tests with Coverage
        working-directory: apps/api
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-qa:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: apps/web
        run: npm run type-check

      - name: Run Next.js Production Build
        working-directory: apps/web
        run: npm run build

      - name: Run API URL Regression Suite
        working-directory: apps/web
        run: node scripts/verify-api-url-construction.mjs

      - name: Run Security Headers & CSP Regression Suite
        working-directory: apps/web
        run: node scripts/verify-security-headers.mjs

      - name: Run Runtime API Proxy Regression Suite
        working-directory: apps/web
        run: node scripts/verify-api-proxy-runtime.mjs

      - name: Run Demo Credentials Isolation Verification
        working-directory: apps/web
        run: node scripts/verify-demo-credentials-isolation.mjs

      - name: Run Public Experience Verification
        working-directory: apps/web
        run: node scripts/verify-public-experience.mjs

      - name: Run Responsive Shell Verification
        working-directory: apps/web
        run: node scripts/verify-responsive-shell.mjs

  e2e-qa:
    name: Full-Stack Integration & Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-qa, frontend-qa]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare CI Environment
        run: |
          cp .env.example .env

      - name: Start Full-Stack Docker Environment
        timeout-minutes: 10
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            up -d --build --wait

      - name: Seed Database and Verify Demo Accounts
        timeout-minutes: 3
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            exec -T api python scripts/seed_dev_accounts.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Frontend Dependencies and Browser
        working-directory: apps/web
        timeout-minutes: 8
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Live Integration Verification
        working-directory: apps/web
        timeout-minutes: 7
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000
          REQUIRE_LIVE_STACK: "true"
        run: |
          node scripts/verify-auth-experience.mjs
          node scripts/verify-authorization-flow.mjs
          node scripts/verify-patient-experience.mjs
          node scripts/verify-doctor-experience.mjs
          node scripts/verify-admin-users.mjs

      - name: Run Playwright E2E Tests
        working-directory: apps/web
        timeout-minutes: 8
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Dump Docker Logs on Failure
        if: failure() || cancelled()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml ps -a || true

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml logs --no-color || true

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear Down Docker Environment
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml down -v --remove-orphans
