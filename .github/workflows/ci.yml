name: Arogyavajra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-qa:
    name: Backend Lint, Migrations & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arogyavajra
          POSTGRES_PASSWORD: arogyavajra_dev_password
          POSTGRES_DB: arogyavajra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://arogyavajra:arogyavajra_dev_password@localhost:5432/arogyavajra
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      APP_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enforceable Ruff Lint Gate
        run: |
          cd apps/api
          python scripts/lint_gate.py

      - name: Wait for PostgreSQL Readiness
        run: |
          python -c "
          import time, psycopg
          for i in range(30):
              try:
                  with psycopg.connect('postgresql://arogyavajra:arogyavajra_dev_password@localhost:5432/arogyavajra') as conn:
                      print('PostgreSQL is ready and accepting connections.')
                      break
              except Exception as e:
                  print(f'Waiting for PostgreSQL... ({e})')
                  time.sleep(1)
          else:
              raise SystemExit('PostgreSQL did not become ready within 30 seconds.')
          "

      - name: Run Database Migrations
        run: |
          cd apps/api
          alembic upgrade head

      - name: Run Pytest Suite with Coverage Gate (>=80%)
        run: |
          cd apps/api
          pytest -v --cov=app/services --cov=app/api/v1 --cov-report=term-missing --cov-fail-under=80

  frontend-qa:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run ESLint
        run: |
          cd apps/web
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          cd apps/web
          npm run type-check

      - name: Run Next.js Build
        run: |
          cd apps/web
          npm run build

      - name: Run API URL Regression Suite
        run: |
          cd apps/web
          node scripts/verify-api-url-construction.mjs

      - name: Run Security Headers & CSP Regression Suite
        run: |
          cd apps/web
          node scripts/verify-security-headers.mjs

      - name: Run Runtime API Proxy Regression Suite
        run: |
          cd apps/web
          node scripts/verify-api-proxy-runtime.mjs

      - name: Run Demo Credentials Isolation Verification
        run: |
          cd apps/web
          node scripts/verify-demo-credentials-isolation.mjs

      - name: Run Public Experience Verification
        run: |
          cd apps/web
          node scripts/verify-public-experience.mjs

      - name: Run Responsive Shell Verification
        run: |
          cd apps/web
          node scripts/verify-responsive-shell.mjs

  e2e-qa:
    name: End-to-End Playwright & Live Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-qa, frontend-qa]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Start Docker Compose Environment
        timeout-minutes: 6
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait

      - name: Seed Database with Initial Data & Verify Accounts
        timeout-minutes: 2
        run: |
          docker compose exec -T api python scripts/seed_dev_accounts.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Ensure Host Workspace Permissions
        run: |
          sudo chown -R $USER:$USER .

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Frontend Dependencies & Playwright
        timeout-minutes: 4
        run: |
          cd apps/web
          npm ci
          npx playwright install chromium

      - name: Run Live Integration Verification Suites
        timeout-minutes: 5
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000
          REQUIRE_LIVE_STACK: "true"
        run: |
          cd apps/web
          node scripts/verify-auth-experience.mjs
          node scripts/verify-authorization-flow.mjs
          node scripts/verify-patient-experience.mjs
          node scripts/verify-doctor-experience.mjs
          node scripts/verify-admin-users.mjs
          node scripts/verify-public-experience.mjs
          node scripts/verify-responsive-shell.mjs

      - name: Run Playwright End-to-End Tests
        timeout-minutes: 5
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
        run: |
          cd apps/web
          npm run test:e2e

      - name: Dump Docker Logs on Failure or Cancellation
        if: failure() || cancelled()
        run: |
          echo "=== ArogyaVajra Containers Status ==="
          docker compose ps -a
          echo "=== ArogyaVajra Web Container Logs ==="
          docker compose logs web
          echo "=== ArogyaVajra API Container Logs ==="
          docker compose logs api
          echo "=== ArogyaVajra DB Container Logs ==="
          docker compose logs db

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Tear Down Docker Environment
        if: always()
        run: |
          docker compose down -v

