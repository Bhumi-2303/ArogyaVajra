# Nginx Reverse Proxy Configuration with Distributed Rate Limiting Zones
# ArogyaVajra Healthcare Platform
#
# Place this configuration in /etc/nginx/conf.d/arogyavajra.conf or include within nginx.conf.
# This complements the application-level PostgreSQL rate limiter with high-throughput
# edge protection against DDoS and brute-force credential stuffing.

# 1. Rate limiting zones (allocated in shared memory)
# Zone for sensitive authentication endpoints (10 requests per minute per IP, with burst)
limit_req_zone $binary_remote_addr zone=auth_limit_zone:10m rate=10r/m;

# Zone for general API endpoints (100 requests per minute per IP)
limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=100r/m;

# Upstream definitions
upstream arogyavajra_api {
    server api:8000;
    keepalive 32;
}

upstream arogyavajra_web {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name app.arogyavajra.local;

    # In production, redirect HTTP to HTTPS:
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # Frontend Next.js routing
    location / {
        proxy_pass http://arogyavajra_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Sensitive Auth Endpoints Rate Limiting (edge protection)
    location ~* ^/api/v1/auth/(login|register|refresh|change-password) {
        limit_req zone=auth_limit_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://arogyavajra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Endpoints
    location /api/ {
        limit_req zone=api_general_zone burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://arogyavajra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
